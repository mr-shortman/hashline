name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GTK4 development files; everything else gtk4-rs needs — GLib, Pango,
      # Cairo, gdk-pixbuf, Graphene — arrives as a dependency of these.
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-4-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: hashline
          path: target/release/hashline
          if-no-files-found: error
