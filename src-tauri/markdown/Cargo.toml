# The parser. Deliberately free of Tauri and of any platform dependency: the
# same code is linked into src-tauri for the desktop and compiled to
# wasm32-unknown-unknown for the browser preview and the test suite
# (docs/decisions/008-parser-reference.md).
[package]
name = "hashline-markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = [
  "html",
] }
unicode-normalization = "0.1"
unicode-general-category = "1"
