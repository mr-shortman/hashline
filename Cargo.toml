# Workspace root for the native stack (docs/decisions/009-native-renderer.md).
#
# The WebView stack is gone: no Tauri shell, no WASM shim, no Node toolchain
# (SPEC.md, section 13). The probe under `benchmarks/` stays excluded — it is a
# measurement tool, not part of the product.
[workspace]
resolver = "2"
members = ["crates/markdown", "crates/hashline"]
exclude = ["benchmarks/pulldown-probe"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
version = "0.1.0"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
