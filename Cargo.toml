# Workspace root for the native stack (docs/architecture.md).
#
# The WebView stack is gone: no Tauri shell, no WASM shim, no Node toolchain.
[workspace]
resolver = "2"
members = ["crates/markdown", "crates/hashline"]
exclude = ["benchmarks/.provision/md-viewer"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
version = "0.1.0"
publish = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
